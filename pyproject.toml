[project]
name = "fpl-agent"
version = "0.1.0"
description = "A season-long FPL decision agent with public evals"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
